<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>New Game Store</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">

        <div class="container-fluid">

            <span class="navbar-brand"
                  onclick="carregarPorCategoria('todos')">

                New Game Store

            </span>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link"
                           href="#"
                           onclick="carregarPorCategoria('eletronicos'); return false;">

                            Eletrônicos

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="#"
                           onclick="carregarPorCategoria('acessorios'); return false;">

                            Acessórios

                        </a>

                    </li>

                    <li class="nav-item">

                        <button class="nav-link"
                                onclick="navegar('tela-contato')">

                            Contato

                        </button>

                    </li>

                    <li id="installAppBt"
                        class="nav-item collapse">

                        <a class="nav-link"
                           href="#"
                           onclick="installApp(); return false;">

                            Instalar APP

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container py-4">

        <h1 class="text-center mb-4">
            New Game Store
        </h1>


        <!-- PRODUTOS -->
        <div id="tela-home"
             class="tela row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 show">
        </div>


        <!-- CONTATO -->
        <div id="tela-contato"
             class="tela collapse">

            <div class="card shadow p-4">

                <h2>Fale Conosco</h2>

                <p>
                    <strong>Endereço:</strong>
                    Rua Exemplo, 123 - Centro
                </p>

                <p>
                    <strong>Cidade:</strong>
                    Florianópolis - SC
                </p>

                <p>
                    <strong>Telefone:</strong>
                    (48) 99999-0000
                </p>

                <p>
                    <strong>Email:</strong>
                    contato@newgamestore.com
                </p>

                <button class="btn btn-dark mt-3"
                        onclick="voltar()">

                    ← Voltar

                </button>

            </div>

        </div>


        <!-- DETALHES DO PRODUTO -->
        <div id="tela-produto"
             class="tela collapse">

            <button class="btn btn-dark mb-3"
                    onclick="voltar()">

                ← Voltar

            </button>

            <div id="detalhes-produto"
                 class="card shadow p-3">
            </div>

        </div>

    </main>


    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
